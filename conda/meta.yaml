package:
  name: pangalactic.vger
  version: "4.4.dev3"

source:
        path: {{path-to-source}}

requirements:
  build:
    - python {{PY_VER}}
    - setuptools

  run:
    - autobahn
    - base58
    - ecdsa
    - pangalactic.core >=4.4.dev3
    - postgresql
    - psycopg2
    # pynacl is needed for autobahn to support cryptosign auth
    - pynacl
    - pyopenssl >=22.1.0
    - python {{PY_VER}}
    - scipy
    - twisted
    # NOTE: LDAP support (pangalactic.vger.userdir) is optional -- it is only
    # needed by deployments whose user identities come from an LDAP personnel
    # directory.  For those, add to this environment:
    #     - openldap
    #     - python-ldap

about:
  # home: https://pangalactic.us
  # license: NASA
  # license_file: LICENSE

